services:
  postgres:
    image: postgres:16-alpine
    container_name: adaptivefit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: adaptivefit
      POSTGRES_USER: adaptivefit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adaptivefit -d adaptivefit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
